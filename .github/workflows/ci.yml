name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django · lint, migrations, OpenAPI, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ridepulse
          POSTGRES_PASSWORD: ridepulse
          POSTGRES_DB: ridepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ridepulse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ridepulse:ridepulse@localhost:5432/ridepulse
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements/base.txt pytest pytest-django pytest-asyncio pytest-cov factory-boy ruff
      - name: Lint and format
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Migrations are up to date
        run: .venv/bin/python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema has no warnings
        run: .venv/bin/python manage.py spectacular --fail-on-warn --file /dev/null
      - name: No breaking API changes (against docs/api/openapi.json)
        run: .venv/bin/python manage.py api_contract
      - name: Tests
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing:skip-covered

  frontend:
    name: React · type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ridepulse
          POSTGRES_PASSWORD: ridepulse
          POSTGRES_DB: ridepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ridepulse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ridepulse:ridepulse@localhost:5432/ridepulse
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the React apps
        working-directory: frontend
        run: npm ci --no-fund --no-audit && npm run build
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements/base.txt pytest pytest-django pytest-asyncio pytest-playwright
          .venv/bin/python -m playwright install --with-deps chromium
      - name: End-to-end tests
        run: .venv/bin/python -m pytest -m e2e

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Python packages with known vulnerabilities
        run: uvx pip-audit -r requirements/base.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm packages with known vulnerabilities (production)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  data:
    name: Data platform · dbt project compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dbt (DuckDB adapter)
        run: |
          uv venv data/.venv
          uv pip install --python data/.venv/bin/python dbt-core dbt-duckdb
      - name: Parse and compile the models and tests
        working-directory: data/dbt
        run: ../.venv/bin/dbt parse --profiles-dir .

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ride-pulse:ci .
