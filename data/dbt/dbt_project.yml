name: ridepulse
version: "1.0.0"
config-version: 2
profile: ridepulse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Where extract.py writes the Parquet lake (relative to this folder).
  lake_path: "../lake/raw"

models:
  ridepulse:
    +meta:
      dagster:
        group: warehouse
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
    reporting:
      +materialized: table
      +schema: reporting
